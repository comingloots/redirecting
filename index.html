<script>
document.addEventListener("DOMContentLoaded", () => {
  try {

    const telegramLink = "https://t.me/+6lIGnBv31Qc4NDZl";

    const whatsappNumbers = [
      "13613616261",
      "13802931053",
      "14053857260",
      "17177544382",
      "14048913643",
      "14633382772",
      "16678246055",
      "19566700992"
    ];

    const clickCount = parseInt(localStorage.getItem("clickCount")) || 0;
    localStorage.setItem("clickCount", clickCount + 1);

    // 1-2 WhatsApp, 3 Telegram (loop)
    if ((clickCount + 1) % 3 === 0) {
      window.location.replace(telegramLink);
    } else {
      const randomNumber =
        whatsappNumbers[Math.floor(Math.random() * whatsappNumbers.length)];

      window.location.replace(`https://wa.me/${randomNumber}`);
    }

  } catch (err) {
    console.error("Redirect error:", err);
  }
});
</script>
