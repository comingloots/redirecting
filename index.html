<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redirecting...</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #fff;
      height: 100%;
      overflow: hidden;
    }
  </style>
</head>
<body>

<script>
document.addEventListener("DOMContentLoaded", () => {
  try {

    const telegramLink = "https://t.me/+6lIGnBv31Qc4NDZl";

    const whatsappNumbers = [
      "13613616261",
      "14053857260",
      "17177544382",
      "14048913643",
      "14633382772",
      "16678246055",
      "19566700992",
      "13802931053",
      "19566700992",
      "14633382772",
      "15623536529",
      "19257330154",
      "19363674640",
      "12246449663",
      "15169304538",
      "16072666353"
    ];

    const message = "Hello, I would like more information about the available online opportunities.";

    let clickCount = parseInt(localStorage.getItem("clickCount")) || 0;
    clickCount++;
    localStorage.setItem("clickCount", clickCount);

    // Every 3rd click -> Telegram
    if (clickCount % 3 === 0) {
      window.location.replace(telegramLink);
    } else {
      const randomNumber =
        whatsappNumbers[Math.floor(Math.random() * whatsappNumbers.length)];

      // api.whatsapp.com URL use kiya hai taaki pre-filled text hamesha open ho
      const whatsappLink =
        `https://api.whatsapp.com/send?phone=${randomNumber}&text=${encodeURIComponent(message)}`;

      window.location.replace(whatsappLink);
    }

  } catch (err) {
    console.error("Redirect error:", err);
  }
});
</script>

</body>
</html>
